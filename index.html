<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Generator · OneSyntax</title>
<link rel="icon" type="image/svg+xml" href="./brand/onesyntax-symbol-black.svg">
<!-- OneSyntax brand type: Geist for text, Geist Mono for values, served with the page (vendor/fonts) so it works
     offline and from any host. -->
<link rel="preload" href="./vendor/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./vendor/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'Geist'; src: url('./vendor/fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Geist Mono'; src: url('./vendor/fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
  /* OneSyntax design system (Rebranding file): square corners, Geist set tight, solid Black / Primary Blue
     actions with sentence-case labels. Controls are filled, never outlined: choices are segments in a tinted
     track, the chosen one a solid white block; colours are square tiles. Icons are Lucide, kept inline. */
  :root {
    --sans: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace;
    --panel-w: 396px; --gap: 20px; --pad: 28px; --chip-w: 58px; --control: 34px;
    --art-right: calc(var(--panel-w) + 2 * var(--gap)); --art-bottom: 0px;
    /* OneSyntax brand: White, Black, Primary Blue; Tangerine for warnings. */
    --white: #FCFCFC; --black: #151515; --primary: #0A89FF;
    --chip: var(--white); --chip-text: var(--black); --accent: var(--primary); --error: #FF5620;
    --tile-shadow: 0 1px 2px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.08);
    /* A gentle overshoot for CSS-only state changes; Motion springs drive everything that moves further. */
    --spring: cubic-bezier(.34, 1.4, .64, 1); --ease: cubic-bezier(.2, .8, .2, 1);
  }
  /* The panel's ink follows what is behind it; the glass behind the ink is dense enough to keep contrast high. */
  body[data-tone="dark"] {
    --text: var(--white); --muted: rgba(252,252,252,.74); --faint: rgba(252,252,252,.54);
    --glass: rgba(18,18,20,.56); --glass-strong: rgba(18,18,20,.72); --line: rgba(252,252,252,.12);
    --track: rgba(252,252,252,.12); --track-hover: rgba(252,252,252,.2);
    --button: rgba(252,252,252,.12); --button-hover: rgba(252,252,252,.2);
    --on-art: rgba(252,252,252,.88); --shadow: 0 24px 64px rgba(0,0,0,.35);
    --cta: var(--white); --cta-text: var(--black); --menu: rgba(21,21,21,.97); --surface: var(--black);
    /* The logo files paint their inner shapes in the colour they were drawn on, so they sit on that exact colour. */
    --logo-bg: var(--black); --logo-text: var(--white);
  }
  body[data-tone="light"] {
    --text: var(--black); --muted: rgba(21,21,21,.68); --faint: rgba(21,21,21,.5);
    --glass: rgba(252,252,252,.8); --glass-strong: rgba(252,252,252,.9); --line: rgba(21,21,21,.08);
    --track: rgba(21,21,21,.06); --track-hover: rgba(21,21,21,.11);
    --button: rgba(21,21,21,.06); --button-hover: rgba(21,21,21,.11);
    --on-art: rgba(21,21,21,.78); --shadow: 0 24px 64px rgba(16,24,40,.18);
    --cta: var(--black); --cta-text: var(--white); --menu: rgba(252,252,252,.98); --surface: var(--white);
    --logo-bg: #EDEDED; --logo-text: var(--black);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.4 var(--sans); letter-spacing: -.01em; color: var(--text); background: var(--art-bg, #FCFCFC);
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; letter-spacing: inherit; color: inherit; border: 0; border-radius: 0; background: none; cursor: pointer; padding: 0; }
  button:disabled { opacity: .3; cursor: default; }
  input, select, textarea { border: 0; border-radius: 0; outline: none; }
  /* Keyboard focus only: buttons get a blue ring, fields a blue base line. */
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { box-shadow: inset 0 -2px 0 var(--accent); }
  .icon { display: block; width: 18px; height: 18px; flex: none; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .glass {
    background: var(--glass); color: var(--text);
    -webkit-backdrop-filter: blur(28px) saturate(150%); backdrop-filter: blur(28px) saturate(150%);
    box-shadow: var(--shadow), inset 0 0 0 1px var(--line);
  }

  /* ---------- Artwork and overlays ---------- */
  #canvas, #stickerCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #canvas[hidden], #stickerCanvas[hidden] { display: none; }  /* display: block above would otherwise keep a hidden canvas showing */
  .frame { position: fixed; pointer-events: none; box-shadow: 0 18px 50px rgba(0,0,0,.2); }
  /* The centre handle: rings round a knob, shown over the artwork; difference blending keeps it visible on any colour. */
  .centre-handle { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 3; pointer-events: none; }
  .centre-handle::before {
    content: ''; position: absolute; left: -96px; top: -96px; width: 192px; height: 192px; border-radius: 50%; mix-blend-mode: difference;
    background: repeating-radial-gradient(circle, transparent 0 15px, rgba(255,255,255,.8) 15px 16px);
    -webkit-mask: radial-gradient(circle, #000 18%, transparent 70%); mask: radial-gradient(circle, #000 18%, transparent 70%);
    opacity: 0; scale: .55; transition: opacity .25s var(--ease), scale .45s var(--spring);
  }
  .centre-handle .knob {
    position: absolute; left: -17px; top: -17px; width: 34px; height: 34px; padding: 0; border-radius: 50%; mix-blend-mode: difference;
    border: 2px solid #fff; background: radial-gradient(circle, #fff 0 3px, transparent 3.5px); cursor: grab;
    opacity: 0; scale: .6; transition: opacity .2s var(--ease), scale .35s var(--spring);
  }
  .centre-handle.shown::before { opacity: 1; scale: 1; }
  .centre-handle.shown .knob { opacity: 1; scale: 1; pointer-events: auto; }
  .centre-handle .knob:hover, .centre-handle.dragging .knob { scale: 1.12; }
  .centre-handle.dragging .knob { cursor: grabbing; }
  .centre-handle.dragging::before { scale: 1.12; }
  .centre-handle .knob:focus-visible { outline: none; box-shadow: 0 0 0 3px #fff; }
  /* Small overlays sit on frosted blocks so they stay legible over any pattern. */
  .chrome { background: var(--glass-strong); color: var(--text); -webkit-backdrop-filter: blur(14px) saturate(150%); backdrop-filter: blur(14px) saturate(150%); }
  .topbar {
    position: fixed; top: 20px; left: 20px; display: flex; gap: 16px; align-items: center; z-index: 4;
    padding: 6px 6px 6px 14px; background: var(--logo-bg); color: var(--logo-text);
  }
  /* Lockup proportions from the brand file: symbol and wordmark share a height, 0.36 × height apart. */
  .logo { display: flex; align-items: center; gap: 6.5px; }
  .logo img { display: block; height: 18px; width: auto; }
  body[data-tone="dark"] .logo.on-light, body[data-tone="light"] .logo.on-dark { display: none; }
  .view { position: relative; display: flex; gap: 2px; padding: 2px; background: rgba(127,127,127,.2); }
  .view .indicator { position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; background: var(--white); pointer-events: none; }
  .view button { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; font-size: 13px; font-weight: 500; opacity: .85; transition: color .25s var(--ease), opacity .25s var(--ease); }
  .view button:hover { opacity: 1; }
  .view button[aria-pressed="true"] { color: var(--black); opacity: 1; }
  .view .icon { width: 14px; height: 14px; }
  /* Fixed offsets use the `translate` property, so Motion's transforms (press, entrances) compose with them. */
  .edge {
    position: fixed; top: calc((100vh - var(--art-bottom)) / 2); translate: 0 -50%; z-index: 4;
    width: 42px; height: 42px; display: grid; place-items: center;
    background: var(--glass-strong); color: var(--text); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  .edge:hover { background: var(--cta); color: var(--cta-text); }
  .edge[hidden] { display: none; }
  .edge .icon { width: 20px; height: 20px; }
  .edge.prev { left: 20px; }
  .edge.next { right: calc(var(--art-right) + 20px); }
  /* Pagination as pixels, after the {OS} braces: the current look is a longer bar. */
  .dots { position: fixed; left: calc((100vw - var(--art-right)) / 2); bottom: calc(var(--art-bottom) + 22px); translate: -50% 0; display: flex; align-items: center; gap: 5px; z-index: 4; padding: 10px 12px; }
  .dots:empty { display: none; }
  .dots button { width: 6px; height: 6px; background: var(--text); opacity: .3; transition: width .35s var(--spring), opacity .2s var(--ease); }
  .dots button:hover { opacity: .6; }
  .dots button[aria-current="true"] { width: 18px; opacity: 1; }
  .meta { position: fixed; left: 20px; top: 70px; font: 10.5px var(--mono); letter-spacing: 0; z-index: 4; padding: 6px 10px; color: var(--muted); }
  .play {
    position: fixed; right: calc(var(--art-right) + 20px); bottom: calc(var(--art-bottom) + 16px); z-index: 4;
    width: 40px; height: 40px; display: grid; place-items: center; background: var(--black); color: var(--white);
  }
  .play .icon { width: 16px; height: 16px; }
  .play[hidden] { display: none; }
  .toast {
    position: fixed; left: calc((100vw - var(--art-right)) / 2); bottom: calc(var(--art-bottom) + 70px); translate: -50% 0;
    max-width: min(520px, calc(100vw - var(--art-right) - 32px)); z-index: 6;
    background: var(--black); color: var(--white); padding: 12px 16px; font-size: 13.5px; font-weight: 500;
    opacity: 0; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--error); }
  /* Tooltips: the brand's ink on paper, inverted against the panel's tone; square, with shortcuts as mono chips. */
  .tip { position: fixed; z-index: 30; max-width: 260px; margin: 0; padding: 7px 10px; border: 0; inset: auto; pointer-events: none;
    background: var(--cta); color: var(--cta-text); font: 500 12.5px/1.35 var(--sans); letter-spacing: -.005em; box-shadow: 0 8px 24px rgba(0,0,0,.22); }
  .tip[hidden] { display: none; }
  .tip kbd { margin-left: 8px; padding: 1px 5px; font: 500 10.5px var(--mono); background: color-mix(in srgb, var(--cta-text) 16%, transparent); }

  /* ---------- Panel ---------- */
  .panel {
    position: fixed; top: var(--gap); right: var(--gap); bottom: var(--gap); width: var(--panel-w); z-index: 5;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-head { padding: 26px var(--pad) 12px; }
  .head-top { display: flex; justify-content: space-between; align-items: center; }
  .eyebrow-row { display: flex; align-items: center; }
  .os-chip { display: inline-grid; place-items: center; height: 22px; padding: 0 7px; margin-right: 10px; background: var(--primary); }
  .os-chip img { display: block; height: 12px; width: auto; }
  .eyebrow { font: 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .history { display: flex; gap: 2px; }
  .history button { width: 32px; height: 32px; display: grid; place-items: center; transition: background .2s var(--ease); }
  .history button:hover:not(:disabled) { background: var(--button); }
  .history .icon { width: 17px; height: 17px; }
  /* Brand headline style: Geist Medium, set tight (−4% like the {OS} lockup). */
  h1 { margin: 16px 0 8px; font-weight: 500; font-size: 40px; line-height: 1; letter-spacing: -.04em; overflow-wrap: anywhere; }
  .lede { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  .status { display: flex; align-items: center; gap: 7px; margin: 12px 0 0; min-height: 18px; font-size: 12.5px; color: var(--muted); }
  .status.edited { color: var(--text); }
  .status.edited::before { content: ''; width: 6px; height: 6px; background: var(--accent); }
  .status button { text-decoration: underline; text-underline-offset: 2px; font-size: 12px; }

  .panel-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px var(--pad) 28px; }
  /* Thin, quiet scrollbars wherever something scrolls: no arrows, no grey gutter. */
  .panel-scroll, dialog#looks, .listbox { scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
  .panel-scroll::-webkit-scrollbar, dialog#looks::-webkit-scrollbar, .listbox::-webkit-scrollbar { width: 6px; }
  .panel-scroll::-webkit-scrollbar-thumb, dialog#looks::-webkit-scrollbar-thumb, .listbox::-webkit-scrollbar-thumb { background: var(--faint); }
  .panel-scroll::-webkit-scrollbar-track, dialog#looks::-webkit-scrollbar-track, .listbox::-webkit-scrollbar-track { background: transparent; }
  .sec { padding-bottom: 8px; }
  .sec + .sec { border-top: 1px solid var(--line); }
  .sec-head {
    display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 24px 0 14px;
    font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: left;
    transition: color .2s var(--ease);
  }
  button.sec-head:hover { color: var(--text); }
  .sec-head .icon { width: 15px; height: 15px; transition: transform .35s var(--spring); }
  .sec-head[aria-expanded="false"] .icon { transform: rotate(-90deg); }
  .sec-body { display: grid; gap: 8px; padding-bottom: 6px; }
  .picker { display: grid; gap: 8px; padding: 4px 0 18px; }  /* same rhythm as every other group of rows */
  .sec-body[hidden] { display: none; }
  .sec-body.moving { overflow: hidden; }
  .sec-hint { margin: -2px 0 4px; font-size: 12.5px; line-height: 1.5; color: var(--muted); }

  .ctl { display: grid; grid-template-columns: 116px minmax(0, 1fr); align-items: center; gap: 16px; min-height: var(--control); }
  .ctl > label, .ctl > .label { font-size: 14px; color: var(--text); }
  .ctl.block { grid-template-columns: 1fr; gap: 8px; }

  /* Slider: a native range (keyboard, touch, screen readers) with the value printed on a white block that rides the track. */
  .slider { position: relative; height: var(--control); --p: 0; }
  .slider input[type=range] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: var(--control); margin: 0; background: transparent; cursor: grab; }
  .slider input[type=range]:active { cursor: grabbing; }
  .slider input[type=range]:focus-visible { box-shadow: none; }
  .slider input[type=range]::-webkit-slider-runnable-track { height: var(--control); background: linear-gradient(90deg, var(--track-hover) 0 calc(var(--p) * 100%), var(--track) 0); }
  .slider:hover input[type=range]::-webkit-slider-runnable-track { background: var(--track-hover); }
  .slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: var(--chip-w); height: var(--control); background: var(--chip); box-shadow: 0 1px 3px rgba(0,0,0,.22); }
  .slider input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 1px 3px rgba(0,0,0,.22), inset 0 -2px 0 var(--accent); }
  .slider input[type=range]::-moz-range-track { height: var(--control); background: var(--track); }
  .slider input[type=range]::-moz-range-progress { height: var(--control); background: var(--track-hover); }
  .slider input[type=range]::-moz-range-thumb { width: var(--chip-w); height: var(--control); border: 0; border-radius: 0; background: var(--chip); box-shadow: 0 1px 3px rgba(0,0,0,.22); }
  /* Values on the thumb: Geist semibold with tabular figures, so digits don't jitter while dragging. */
  .slider .chip {
    position: absolute; top: 0; left: calc(var(--p) * (100% - var(--chip-w))); width: var(--chip-w); height: var(--control);
    display: grid; place-items: center; font: 600 12.5px/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em;
    color: var(--chip-text); pointer-events: none; white-space: nowrap;
  }
  .slider .chip-input {
    position: absolute; top: 0; left: calc(var(--p) * (100% - 76px)); width: 76px; height: var(--control); z-index: 1;
    background: var(--chip); color: var(--chip-text); font: 600 13px var(--sans); font-variant-numeric: tabular-nums; text-align: center;
    box-shadow: inset 0 -2px 0 var(--accent), 0 4px 14px rgba(0,0,0,.22);
  }

  /* Segmented choice: a tinted track with one solid white block that slides to the chosen segment. */
  .segmented { position: relative; display: flex; gap: 2px; padding: 2px; background: var(--track); }
  .segmented .indicator { position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; background: var(--chip); box-shadow: 0 1px 3px rgba(0,0,0,.2); pointer-events: none; }
  .segmented .indicator, .view .indicator { transition: transform .42s var(--spring), width .42s var(--spring); }
  .indicator.instant { transition: none; }
  /* Each choice starts at its label's width and shares out the rest, so longer labels never clip. */
  .segmented button { position: relative; z-index: 1; flex: 1 1 auto; min-width: 0; height: calc(var(--control) - 4px); padding: 0 6px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .25s var(--ease); }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-checked="true"], .segmented button[aria-current="true"] { color: var(--chip-text); }
  .segmented .glyph { display: block; width: 26px; height: 13px; margin: 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .segmented .glyph.solid { fill: currentColor; stroke: none; }

  /* Toggle switch: square track, square knob. */
  .switch { -webkit-appearance: none; appearance: none; position: relative; width: 38px; height: 22px; margin: 0; flex: none; background: var(--track-hover); cursor: pointer; transition: background .25s var(--ease); }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: var(--white); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .4s var(--spring), width .2s var(--ease); }
  .switch:active::after { width: 20px; }  /* the knob stretches toward where it's going, like a fluid toggle */
  .switch:checked { background: var(--primary); }
  .switch:checked::after { transform: translateX(16px); }
  .switch:checked:active::after { transform: translateX(12px); }
  .switch:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

  .select { position: relative; display: block; }
  .select .icon { position: absolute; right: 9px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .select select { -webkit-appearance: none; appearance: none; width: 100%; height: var(--control); padding: 0 32px 0 11px; background: var(--track); color: var(--text); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .2s var(--ease); }
  .select select:hover { background: var(--track-hover); }
  .select select option, .select select optgroup { color: var(--black); background: var(--white); }
  /* Dropdowns open this list (the export menu's look) instead of the system one. */
  .listbox { position: fixed; z-index: 9; overflow-y: auto; overscroll-behavior: contain; padding: 6px; background: var(--menu); color: var(--text); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
  .listbox .group { padding: 10px 10px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .listbox .group ~ .group { margin-top: 6px; padding-top: 14px; box-shadow: inset 0 1px 0 var(--line); }
  .listbox button { display: grid; grid-template-columns: 1fr 15px; align-items: center; gap: 12px; width: 100%; height: 34px; padding: 0 10px; text-align: left; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s var(--ease); }
  .listbox button:hover, .listbox button:focus { background: var(--button); box-shadow: none; outline: none; }
  .listbox button:disabled { color: var(--faint); cursor: default; }
  .listbox .icon { width: 15px; height: 15px; }
  .listbox.previews button { grid-template-columns: 36px 1fr 15px; height: 46px; padding: 0 10px 0 5px; }
  .listbox.previews canvas { width: 36px; height: 36px; display: block; box-shadow: inset 0 0 0 1px var(--line); }
  .action-field { display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; }
  .action-field .icon { width: 16px; height: 16px; flex: none; }
  .action-field:hover { background: var(--button-hover); }
  .text-field { width: 100%; height: var(--control); padding: 0 11px; background: var(--track); color: var(--text); font: inherit; font-size: 14px; font-weight: 500; transition: background .2s var(--ease); }
  .text-field:hover { background: var(--track-hover); }

  /* Colours: square brand tiles. */
  .tile { display: block; width: 22px; height: 22px; flex: none; background: var(--c); box-shadow: var(--tile-shadow); }
  .colour-row { transition: background .2s var(--ease); display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; height: var(--control); padding: 0 10px 0 6px; background: var(--track); text-align: left; }
  .colour-row:hover { background: var(--track-hover); }
  .colour-row .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .colour-row .hex { font: 11.5px var(--mono); letter-spacing: 0; color: var(--muted); text-transform: uppercase; }
  .gradient-row { display: flex; align-items: center; gap: 8px; height: var(--control); padding: 0 10px 0 6px; background: var(--track); }
  .gradient-row .stop { padding: 0; transition: translate .3s var(--spring); }
  .gradient-row .stop:hover { translate: 0 -2px; }
  .gradient-row .bar { flex: 1; height: 6px; }
  .off-brand { font: 500 9.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--error); margin-left: 6px; }
  .palettes { display: grid; grid-template-columns: repeat(auto-fill, 28px); gap: 10px 8px; padding-top: 2px; }
  /* A palette tile: its background, with a block of its mark colour. */
  .palettes button { position: relative; width: 28px; height: 28px; background: var(--a); box-shadow: var(--tile-shadow); transition: translate .3s var(--spring); }
  .palettes button::after { content: ''; position: absolute; right: 5px; bottom: 5px; width: 11px; height: 11px; background: var(--b); transition: scale .3s var(--spring); }
  .palettes button:hover { translate: 0 -2px; }
  .palettes button:hover::after { scale: 1.25; }
  .palettes button[aria-pressed="true"] { translate: 0 -3px; }
  .palettes button[aria-pressed="true"]::before { content: ''; position: absolute; left: 0; right: 0; bottom: -7px; height: 2px; background: var(--text); transform-origin: left; animation: grow .45s var(--spring); }
  @keyframes grow { from { transform: scaleX(0); } }
  .palette-name { margin-top: 10px; font-size: 12.5px; color: var(--muted); }

  /* Brand colour picker: only OneSyntax colours can be chosen. */
  .swatch-pop { position: fixed; z-index: 9; width: 300px; padding: 16px; background: var(--menu); color: var(--text); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
  .swatch-pop[hidden] { display: none; }
  .swatch-pop h4 { margin: 12px 0 7px; font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .swatch-pop h4:first-child { margin-top: 0; }
  .swatch-pop .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch-pop button { display: grid; place-items: center; width: 26px; height: 26px; background: var(--c); color: var(--ink); box-shadow: var(--tile-shadow); transition: translate .3s var(--spring); }
  .swatch-pop button:hover { translate: 0 -2px; }
  .swatch-pop button .icon { width: 15px; height: 15px; }
  .swatch-pop .picked { margin: 14px 0 0; font-size: 12px; color: var(--muted); min-height: 16px; }
  textarea { width: 100%; font: 12px/1.5 var(--mono); background: var(--track); color: var(--text); padding: 9px 11px; resize: vertical; }
  .note { font-size: 12px; color: var(--faint); margin: 0; }
  .note.invalid { color: #FF8A65; }
  body[data-tone="light"] .note.invalid { color: var(--error); }

  .look-button { transition: background .2s var(--ease); display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; height: var(--control); padding: 3px 8px 3px 3px; background: var(--track); text-align: left; }
  .look-button:hover { background: var(--track-hover); }
  .look-button canvas { width: 28px; height: 28px; display: block; }
  .look-button .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .look-button .browse { display: flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted); }
  .look-button .browse .icon { width: 15px; height: 15px; }
  .tips { margin: 20px 0 0; font-size: 12px; line-height: 1.5; color: var(--faint); }
  /* Seed: a stepper (previous · value · next) and a dice that rolls a new one. */
  .seed-row { display: flex; background: var(--track); }
  .stepper { flex: 1; min-width: 0; display: flex; height: var(--control); }
  .stepper input { flex: 1; min-width: 0; background: none; color: var(--text); text-align: center; font: 600 14px var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stepper button, .dice { flex: none; width: var(--control); height: var(--control); display: grid; place-items: center; color: var(--muted); transition: background .2s var(--ease), color .2s var(--ease); }
  .stepper button:hover { background: var(--track-hover); color: var(--text); }
  .stepper .icon, .dice .icon { width: 15px; height: 15px; }
  .dice { box-shadow: inset 1px 0 0 var(--line); }
  .dice:hover { background: var(--cta); color: var(--cta-text); }

  .panel-foot { padding: 16px var(--pad) 22px; box-shadow: inset 0 1px 0 var(--line); }
  .save-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .save-row[hidden] { display: none; }
  .save-row input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; background: var(--track); color: var(--text); font: inherit; font-weight: 500; }
  .save-row input::placeholder { color: var(--faint); font-weight: 400; }
  .bar { display: flex; gap: 6px; align-items: center; }
  .square { width: 44px; height: 44px; flex: none; background: var(--button); display: grid; place-items: center; transition: background .2s var(--ease); }
  .square:hover:not(:disabled) { background: var(--button-hover); }
  .square.small { width: 40px; height: 40px; }
  /* Primary action, after the brand's "Read Case Study" and "Follow" buttons. */
  .cta { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; background: var(--cta); color: var(--cta-text); font-weight: 500; font-size: 15px; letter-spacing: -.02em; transition: background .25s var(--ease), color .25s var(--ease); }
  .cta:hover { background: var(--primary); color: var(--white); }
  .cta .icon { width: 17px; height: 17px; }
  .cta.small { flex: none; padding: 0 18px; height: 40px; font-size: 14px; }
  .menu-wrap { position: relative; }
  /* Glass nested inside the glass panel can't blur, so the menu is near-solid. */
  .menu { position: absolute; left: 0; bottom: 54px; min-width: 292px; white-space: nowrap; padding: 6px; z-index: 7; background: var(--menu); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
  .menu[hidden] { display: none; }
  .menu button, .menu label { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 12px; text-align: left; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .2s var(--ease); }
  .menu button:hover:not(:disabled), .menu label:hover { background: var(--button); }
  .menu .icon { width: 17px; height: 17px; color: var(--muted); }
  .menu-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; height: 40px; padding: 0 6px 0 12px; }
  /* Same icon column and gap as the menu buttons, so the PNG label lines up with the rows below it. */
  .menu-label { display: grid; grid-template-columns: 18px 1fr; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; }
  .menu .scales { display: flex; gap: 2px; }
  .menu .scales button { display: flex; align-items: center; justify-content: center; width: 38px; height: 30px; padding: 0; text-align: center; background: var(--button); font: 600 12.5px var(--sans); font-variant-numeric: tabular-nums; }
  .menu .scales button:hover { background: var(--cta); color: var(--cta-text); }
  .menu small { color: var(--muted); font-size: 11.5px; font-weight: 400; }
  .menu hr { border: 0; height: 1px; background: var(--line); margin: 5px 6px; }

  /* ---------- Look picker ---------- */
  dialog#looks {
    width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 0;
    background: var(--glass-strong); color: var(--text);
  }
  dialog#looks::backdrop { background: rgba(10,12,18,.35); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  /* Solid, so presets scrolling underneath never show through the title and buttons. */
  .looks-head { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 20px 24px 16px; box-shadow: inset 0 -1px 0 var(--line); background: var(--surface); }
  /* The group bar: a second row under the title, its highlight on the group in view. */
  .looks-nav { flex: 1 0 100%; min-width: 0; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .looks-nav::-webkit-scrollbar { display: none; }
  /* Names never shorten: past the window's width the bar scrolls sideways instead. */
  .looks-nav button { flex: 1 0 auto; padding: 0 12px; }
  @media (max-width: 520px) {
    /* Import and Export keep their icons (and tooltips) so the title row fits a phone. */
    .looks-head .chip-button:not(.icon-only) { width: 36px; padding: 0; gap: 0; justify-content: center; font-size: 0; }
  }
  .looks-head h2:focus { outline: none; }
  .looks-head h2 { margin: 0 auto 0 0; font-weight: 500; font-size: 26px; letter-spacing: -.04em; }
  .looks-head .chip-button { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; background: var(--button); font-size: 13px; font-weight: 500; }
  .looks-head .chip-button:hover:not(:disabled) { background: var(--button-hover); }
  .looks-head .chip-button .icon { width: 16px; height: 16px; }
  .looks-head .chip-button.icon-only { width: 36px; padding: 0; justify-content: center; }
  .looks-body { padding: 4px 24px 28px; }
  .looks-body h3 { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .14em; margin: 24px 0 12px; }
  .looks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(144px, 1fr)); gap: 18px; }
  .look-card { position: relative; }
  .look-card > button.pick { display: block; width: 100%; text-align: left; }
  .look-card canvas { display: block; width: 100%; aspect-ratio: 1; box-shadow: var(--tile-shadow); transition: translate .35s var(--spring), box-shadow .3s var(--ease); }
  .look-card > button.pick:hover canvas { translate: 0 -4px; box-shadow: 0 10px 24px rgba(0,0,0,.2); }
  .look-card.current canvas { translate: 0 -3px; }
  .look-card.current .name::before { content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 7px; background: var(--accent); vertical-align: 1px; }
  .look-card .name { display: block; padding: 9px 0 0; font-size: 13px; font-weight: 500; }
  .look-card small { display: block; font-size: 11.5px; color: var(--muted); }
  .look-card .del { position: absolute; top: 6px; right: 6px; height: 28px; min-width: 28px; padding: 0 6px; display: grid; place-items: center; background: var(--black); color: var(--white); font-size: 12px; font-weight: 500; opacity: 0; transition: opacity .12s; }
  .look-card .del .icon { width: 15px; height: 15px; }
  .look-card:hover .del, .look-card .del:focus-visible, .look-card .del.confirm { opacity: 1; }
  .look-card .del.confirm { background: var(--error); padding: 0 10px; }
  .looks-empty { color: var(--muted); font-size: 13px; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
  }

  @media (max-width: 820px) {
    :root { --gap: 10px; --pad: 18px; --art-right: 0px; --art-bottom: calc(56vh + 20px); }
    .panel { top: auto; left: var(--gap); right: var(--gap); width: auto; height: 56vh; }
    .panel-head { padding: 16px var(--pad) 4px; }
    .panel-foot { padding: 10px var(--pad) 14px; }
    h1 { font-size: 28px; margin: 8px 0 4px; }
    .lede { display: none; }
    .topbar { top: 12px; left: 12px; }
    .view button span { display: none; }
    .edge { width: 36px; height: 36px; }
    .edge.prev { left: 10px; } .edge.next { right: 10px; }
    .meta { display: none; }
  }
</style>
</head>

<script>
const E = window.WaveEngine;
const STRIDE = E.STRIDE;

// ---------- Icons ----------
// The 24 Lucide icons the page uses (lucide.dev, ISC licence, v0.460.0), kept here instead of loading the whole
// set (356 KB) from a CDN. Names are the page's own; each comment gives the Lucide name.
const ICONS = {
  'chevron-left': '<path d="m15 18-6-6 6-6"/>',  // ChevronLeft
  'chevron-right': '<path d="m9 18 6-6-6-6"/>',  // ChevronRight
  'chevron-down': '<path d="m6 9 6 6 6-6"/>',  // ChevronDown
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>',  // Undo2
  redo: '<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/>',  // Redo2
  export: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',  // Download
  shuffle: '<path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>',  // Shuffle
  reset: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',  // RotateCcw
  pause: '<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',  // Pause
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',  // Play
  close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',  // X
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',  // Plus
  minus: '<path d="M5 12h14"/>',  // Minus
  dice: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M16 8h.01"/><path d="M8 8h.01"/><path d="M8 16h.01"/><path d="M16 16h.01"/><path d="M12 12h.01"/>',  // Dice5
  check: '<path d="M20 6 9 17l-5-5"/>',  // Check
  fill: '<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/>',  // Maximize2
  fit: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>',  // Scan
  image: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',  // Image
  vector: '<path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m5 12-3 3 3 3"/><path d="m9 18 3-3-3-3"/>',  // FileCode2
  sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>',  // Sparkles
  film: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/>',  // Film
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',  // Link
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',  // Upload
  transparent: '<path d="M5 3a2 2 0 0 0-2 2"/><path d="M19 3a2 2 0 0 1 2 2"/><path d="M21 19a2 2 0 0 1-2 2"/><path d="M5 21a2 2 0 0 1-2-2"/><path d="M9 3h1"/><path d="M9 21h1"/><path d="M14 3h1"/><path d="M14 21h1"/><path d="M3 9v1"/><path d="M21 9v1"/><path d="M3 14v1"/><path d="M21 14v1"/>',  // SquareDashed
};
const icon = (name) => ICONS[name]
  ? `<svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`
  : '';
for (const el of document.querySelectorAll('[data-icon]')) el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon));

// ---------- Motion ----------
// Micro-animations are Motion (motion.dev) springs. Without the library, or with reduced motion on,
// every change lands instantly and nothing depends on an animation finishing.
const MOTION = window.Motion;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const SPRING = { type: 'spring', visualDuration: 0.32, bounce: 0.18 };   // most movement

function buildPanel({ enter = false } = {}) {
  const scroll = document.getElementById('panelScroll');
  const top = scroll.scrollTop;
  scroll.innerHTML = '';
  scroll.appendChild(buildPicker());
  panelControls = visibleControls();
  const pattern = patternOf(state.pattern);
  for (const [title, controls, hint, when] of pattern.sections) if (!when || when(state.values)) scroll.appendChild(section(title, controls, hint));
  scroll.appendChild(section('Colour', pattern.look));
  // The sticker's settings exist from the first time the panel shows them (off until turned on).
  if (!state.values.sticker) { state.values.sticker = { ...STICKER_DEFAULTS }; baseline.values.sticker = { ...STICKER_DEFAULTS }; }
  scroll.appendChild(section('Sticker', STICKER_CONTROLS, 'Shows this pattern on the {OS} sticker. Exports, presets and links include it.'));
  scroll.insertAdjacentHTML('beforeend', '<p class="tips">Double-click a slider to type a value · Alt-click to reset it · ← → to step through presets</p>');
  scroll.scrollTop = enter ? 0 : top;
  for (const group of scroll.querySelectorAll('.segmented')) placeIndicator(group, false);
  updateHeader();
  if (enter) {
    move([...scroll.children], { opacity: [0, 1], y: [12, 0] }, { ...GENTLE, delay: stagger(0.035) });
    move([document.getElementById('title'), document.getElementById('lede')], { opacity: [0, 1], y: [8, 0] }, { ...GENTLE, delay: stagger(0.05) });
  }
  if (revealNext) {
    const body = [...scroll.querySelectorAll('.sec')].find((s) => s.querySelector('.sec-head span')?.textContent === revealNext)?.querySelector('.sec-body');
    if (body && !body.hidden) springOpen(body);
    revealNext = null;
  }
}

// Sections open and close on a spring; a token makes a quick re-toggle cancel the earlier one.
function springOpen(body) {
  const token = (body._toggle = (body._toggle || 0) + 1);
  body.hidden = false;
  for (const group of body.querySelectorAll('.segmented')) placeIndicator(group, false);  // hidden groups had no size to measure
  body.classList.add('moving');
  after(move(body, { height: [0, body.scrollHeight], opacity: [0, 1] }, GENTLE), () => {
    if (body._toggle !== token) return;
    body.classList.remove('moving'); body.style.height = '';
  });
}
function springClose(body) {
  const token = (body._toggle = (body._toggle || 0) + 1);
  body.classList.add('moving');
  after(move(body, { height: [body.scrollHeight, 0], opacity: [1, 0] }, SNAP), () => {
    if (body._toggle !== token) return;
    body.hidden = true; body.classList.remove('moving'); body.style.height = ''; body.style.opacity = '';
  });
}

function buildPicker() {
  const wrap = document.createElement('div');
  wrap.className = 'sec picker';
  const preset = presetState(current);
  const name = preset && preset.pattern === state.pattern ? label(current) : 'Unsaved preset';
  wrap.innerHTML = `
    <div class="ctl"><label for="patternSelect" title="Pattern · what gets drawn">Pattern</label>
      <span class="select"><select id="patternSelect">${PATTERN_GROUPS.map(([group, names]) => `<optgroup label="${group}">${names.map((n) => `<option>${n}</option>`).join('')}</optgroup>`).join('')}</select>${icon('chevron-down')}</span></div>
    <div class="ctl"><span class="label" title="Preset · saved settings for this pattern, built-in or yours">Preset</span>
      <button class="look-button" id="presetButton" aria-haspopup="dialog">
        <canvas width="68" height="68" aria-hidden="true"></canvas><span class="name" title="${escapeHtml(name)}">${escapeHtml(name)}</span><span class="browse" aria-label="Browse presets" title="All presets">All${icon('chevron-right')}</span>
      </button></div>
    <div class="ctl"><label for="seedInput">Seed</label>
      <span class="seed-row"><span class="stepper">
        <button class="step" data-step="-1" aria-label="Previous seed" title="Previous seed">${icon('minus')}</button>
        <input id="seedInput" type="number" min="0" max="${MAX_SEED}" step="1" inputmode="numeric" title="Seed · the same preset and seed always give the same result">
        <button class="step" data-step="1" aria-label="Next seed" title="Next seed">${icon('plus')}</button></span>
      <button class="dice" id="seedDice" aria-label="Remix with a random seed" title="Random seed · a fresh remix of this preset">${icon('dice')}</button></span></div>`;
  if (preset && preset.pattern === state.pattern) paintThumb(wrap.querySelector('canvas'), current, preset);
  else drawThumb(wrap.querySelector('canvas'), state);
  const select = wrap.querySelector('#patternSelect');
  select.value = state.pattern;
  select.addEventListener('change', () => applyPreset('builtin:' + firstPreset(select.value).name));
  wrap.querySelector('#presetButton').addEventListener('click', openLooks);
  const seedInput = wrap.querySelector('#seedInput');
  seedInput.value = state.values.seed;
  seedInput.addEventListener('change', () => applySeed(seedInput.value));
  // The panel rebuilds on every seed, so focus returns to the same control for repeated clicks or key presses.
  for (const step of wrap.querySelectorAll('.step')) step.addEventListener('click', () => {
    applySeed((state.values.seed + Number(step.dataset.step) + MAX_SEED + 1) % (MAX_SEED + 1));
    document.querySelector(`.step[data-step="${step.dataset.step}"]`).focus();
  });
  // On a sticker the dice also rolls one of the sticker's colour schemes.
  wrap.querySelector('#seedDice').addEventListener('click', () => {
    if (stickerOn(state)) shuffleStickerScheme();
    newVariation(); document.getElementById('seedDice').focus();
  });
  return wrap;
}

function section(title, controls, hint) {
  const sec = document.createElement('section');
  sec.className = 'sec';
  const isPulse = title === 'Pulse';
  const open = isPulse ? state.values.pulse.enabled : openSections.get(title) ?? true;
  sec.innerHTML = isPulse
    ? `<label class="sec-head"><span>${title}</span><input type="checkbox" class="switch" aria-label="Pulse on"></label>`
    : `<button class="sec-head" aria-expanded="${open}"><span>${title}</span>${icon('chevron-down')}</button>`;
  const body = document.createElement('div');
  body.className = 'sec-body';
  body.hidden = !open;
  if (hint) body.insertAdjacentHTML('beforeend', `<p class="sec-hint">${hint}</p>`);
  for (const c of controls) if (!c.when || c.when(state.values)) body.appendChild(control(c));
  sec.appendChild(body);
  if (isPulse) {
    const toggle = sec.querySelector('input');
    toggle.checked = state.values.pulse.enabled;
    toggle.addEventListener('change', () => {
      const q = state.values.pulse;
      q.enabled = toggle.checked;
      if (q.enabled && pulseNeutral(q)) q.opacityMin = 0.2;  // give a fresh pulse something visible
      edit();
      // Let the switch finish its slide, then open or close the section on a spring.
      if (q.enabled) setTimeout(() => { revealNext = title; buildPanel(); }, 120);
      else springClose(body);
    });
  } else {
    const head = sec.querySelector('.sec-head');
    head.addEventListener('click', () => {
      const opening = body.hidden;
      openSections.set(title, opening);
      head.setAttribute('aria-expanded', String(opening));
      if (opening) springOpen(body); else springClose(body);
    });
  }
  return sec;
}

function control(c) {
  const v = state.values, id = 'c' + uid++;
  const row = document.createElement('div');
  row.className = 'ctl';

  if (c.type === 'range') {
    const keys = keysOf(c);
    // A preset (or a typed value) may sit past the slider's usual range: the slider stretches to include it and the
    // preset's own value, so touching it never snaps the value back inside and it can always return to the preset.
    const here = [getPath(state.values, keys[0]), baseline.pattern === state.pattern ? getPath(baseline.values, keys[0]) : undefined].filter(Number.isFinite);
    const min = Math.min(c.min, ...here), max = Math.max(c.max, ...here);
    row.innerHTML = `<label for="${id}">${c.label}</label><div class="slider"><input type="range" id="${id}" data-key="${keys[0]}" min="${min}" max="${max}" step="${c.step}"><span class="chip"></span></div>`;
    const slider = row.querySelector('.slider'), input = slider.querySelector('input'), chip = slider.querySelector('.chip');
    // A slider that shows or hides other controls (Columns reveals Gap) rebuilds the panel once it is let go.
    if (c.rebuild) input.addEventListener('change', () => {
      if (visibleControls() === panelControls) return;
      buildPanel();
      document.querySelector(`#panelScroll input[data-key="${keys[0]}"]`)?.focus();
    });
    const value = () => getPath(state.values, keys[0]);
    const paint = (x) => { chip.textContent = c.fmt(x); slider.style.setProperty('--p', E.clamp((x - min) / (max - min))); };
    const show = () => { input.value = value(); paint(value()); };
    input.refresh = show;
    // Paired limits (Thinnest and Thickest, Min and Max opacity…) never cross: dragging one past the other carries it along.
    const partner = keys.length === 1 && partnerKey(keys[0]), low = /(\.min|Min)$/.test(keys[0]);
    const set = (next) => {
      for (const k of keys) setPath(state.values, k, next);
      const other = partner && getPath(state.values, partner);
      if (typeof other !== 'number' || (low ? next <= other : next >= other)) return;
      setPath(state.values, partner, next);
      document.querySelector(`#panelScroll input[data-key="${partner}"]`)?.refresh();
    };
    show();
    input.addEventListener('input', () => { const x = parseFloat(input.value); set(x); paint(x); edit(); });
    input.addEventListener('pointerdown', (e) => {
      if (!e.altKey || baseline.pattern !== state.pattern) return;
      e.preventDefault();
      set(getPath(baseline.values, keys[0])); show(); edit();
    });
    input.addEventListener('dblclick', () => {
      const field = document.createElement('input');
      field.type = 'number'; field.step = 'any'; field.className = 'chip-input';
      field.setAttribute('aria-label', c.label);
      field.value = Number((value() * c.typeScale).toFixed(4));
      slider.appendChild(field); field.focus(); field.select();
      move(field, { opacity: [0, 1], scale: [0.88, 1] }, SPRING);
      let finished = false;
      const finish = (commit) => {
        if (finished) return;
        finished = true;
        const typed = parseFloat(field.value);
        // A typed value may go past the slider's top (up to ten times it), never below its bottom; the panel rebuilds
        // to fit it.
        if (commit && Number.isFinite(typed)) { set(E.clamp(typed / c.typeScale, min, c.max > 0 ? Math.max(max, c.max * 10) : max)); edit(); }
        field.remove(); show();
        if (commit && (value() < min || value() > max)) buildPanel();
      };
      field.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); });
      field.addEventListener('blur', () => finish(true));
    });
  } else if (c.type === 'select' && c.options.length <= 4) {
    row.innerHTML = `<span class="label">${c.label}</span><div class="segmented" role="radiogroup" aria-label="${c.label}"><span class="indicator" aria-hidden="true"></span>${c.options.map(([text, value, art]) =>
      `<button role="radio" data-value="${value}"${art ? ` title="${text}" aria-label="${text}"` : ''}>${art || text}</button>`).join('')}</div>`;
    const group = row.querySelector('.segmented'), buttons = [...row.querySelectorAll('button')];
    const mark = () => buttons.forEach((b) => b.setAttribute('aria-checked', String(b.dataset.value === getPath(state.values, c.key))));
    mark();
    buttons.forEach((b) => b.addEventListener('click', () => {
      if (b.getAttribute('aria-checked') === 'true') return;
      setPath(state.values, c.key, b.dataset.value); mark();
      placeIndicator(group, true);
      edit();
      // Controls that only apply to some choices appear or disappear once the block has slid across.
      if (c.rebuild) setTimeout(() => buildPanel(), moving() ? 170 : 0);
    }));
  } else if (c.type === 'select') {
    // Longer lists drop down instead.
    row.innerHTML = `<label for="${id}">${c.label}</label><span class="select"><select id="${id}">${c.options.map(([text, value]) => `<option value="${value}">${text}</option>`).join('')}</select>${icon('chevron-down')}</span>`;
    const select = row.querySelector('select');
    select.value = getPath(v, c.key);
    select.addEventListener('change', () => { setPath(state.values, c.key, select.value); edit(); if (c.rebuild) buildPanel(); });
  } else if (c.type === 'action') {
    row.innerHTML = `<label>${c.label}</label><button type="button" class="text-field action-field">${icon(c.icon)}<span>${c.text}</span></button>`;
    row.querySelector('button').addEventListener('click', () => { c.run(); edit(); if (c.rebuild) buildPanel(); });
  } else if (c.type === 'text') {
    row.innerHTML = `<label for="${id}">${c.label}</label><input class="text-field" id="${id}" type="text" maxlength="24" spellcheck="false" autocomplete="off">`;
    const input = row.querySelector('input');
    input.value = getPath(v, c.key);
    input.addEventListener('input', () => { setPath(state.values, c.key, input.value); edit(); });
  } else if (c.type === 'color') {
    row.innerHTML = `<span class="label">${c.label}</span><button class="colour-row" id="${id}"><span class="tile"></span><span class="name"></span><span class="hex"></span></button>`;
    const button = row.querySelector('.colour-row');
    const paint = (x) => {
      button.querySelector('.tile').style.setProperty('--c', x);
      button.querySelector('.name').innerHTML = brandName(x) ? escapeHtml(brandName(x)) : `Custom<span class="off-brand">off-brand</span>`;
      button.querySelector('.hex').textContent = x;
      button.setAttribute('aria-label', `${c.label}: ${brandName(x) || x}. Choose a brand colour`);
    };
    paint(getPath(v, c.key));
    button.addEventListener('click', () => openSwatches(button, getPath(state.values, c.key), (x) => {
      setPath(state.values, c.key, x); paint(x); markCustomPalette(); edit();
      move(button.querySelector('.tile'), { scale: [0.5, 1] }, SPRING);
    }));
  } else if (c.type === 'gradient') {
    const keys = ['colour.stop1', 'colour.stop2', ...(v.colour.stops === 3 ? ['colour.stop3'] : [])];
    row.innerHTML = `<span class="label">${c.label}</span><div class="gradient-row" role="group" aria-label="${c.label}"></div>`;
    const holder = row.querySelector('.gradient-row'), bar = document.createElement('span');
    bar.className = 'bar';
    const paint = () => { bar.style.background = `linear-gradient(90deg, ${keys.map((k) => getPath(state.values, k)).join(', ')})`; };
    keys.forEach((k, i) => {
      const stop = document.createElement('button');
      stop.className = 'tile stop';
      const label = () => { const x = getPath(state.values, k); stop.style.setProperty('--c', x); stop.title = `Colour ${i + 1}: ${brandName(x) || x + ' (off-brand)'}`; stop.setAttribute('aria-label', stop.title); };
      label();
      stop.addEventListener('click', () => openSwatches(stop, getPath(state.values, k), (x) => { setPath(state.values, k, x); label(); paint(); markCustomPalette(); edit(); }));
      holder.appendChild(stop);
    });
    holder.appendChild(bar);
    paint();
  } else if (c.type === 'palette') {
    const name = isFlat(state) ? v.palette : v.colour.palette;
    const tiles = BRAND_PALETTES.map((p) => `<button title="${p.name}" aria-label="${p.name} palette" aria-pressed="${p.name === name}" data-name="${p.name}" style="--a:${p.background};--b:${p.stop1}"></button>`).join('');
    row.innerHTML = `<span class="label">Palette</span><div><div class="palettes">${tiles}</div><p class="palette-name">${paletteNamed(name) ? escapeHtml(name) : 'Custom colours'}</p></div>`;
    row.style.alignItems = 'start';
    row.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      applyPalette(b.dataset.name); buildPanel(); edit();
      // The rebuilt panel's chosen tile pops in place, and its colour rows refill.
      move(document.querySelector('.palettes [aria-pressed="true"]'), { scale: [0.72, 1] }, SPRING);
      move(document.querySelectorAll('.colour-row .tile, .gradient-row .tile'), { scale: [0.6, 1] }, { ...SPRING, delay: stagger(0.04) });
    }));
  } else if (c.type === 'format') {
    const format = isFlat(state) ? v.format : v.canvas.format;
    const custom = FORMATS[format] ? '' : `<option value="${format}" disabled>Custom ${v.canvas.width} × ${v.canvas.height}</option>`;
    row.innerHTML = `<label for="${id}">Format</label><span class="select"><select id="${id}">${custom}${Object.keys(FORMATS).map((f) => `<option>${f}</option>`).join('')}</select>${icon('chevron-down')}</span>`;
    const select = row.querySelector('select');
    select.value = format;
    select.addEventListener('change', () => { setFormat(select.value); edit(); });
  } else if (c.type === 'data') {
    const help = 'Comma-separated numbers. Leave empty for a seeded random walk.';
    row.className = 'ctl block';
    row.innerHTML = `<label for="${id}">${c.label}</label><textarea id="${id}" rows="3" spellcheck="false" placeholder="12, 24, 18, 32, 29, 42"></textarea><p class="note">${help}</p>`;
    const textarea = row.querySelector('textarea'), note = row.querySelector('.note');
    textarea.value = getPath(v, c.key);
    textarea.addEventListener('input', () => {
      const value = textarea.value.trim();
      const parts = value ? value.split(/[\s,;]+/).filter(Boolean) : [];
      const valid = parts.length <= 10000 && parts.every((part) => Number.isFinite(Number(part)));
      note.classList.toggle('invalid', !valid);
      note.textContent = valid ? help : 'Use numbers separated by commas or spaces. The last valid data is still shown.';
      if (valid) { setPath(state.values, c.key, value); edit(); }
    });
  }
  return row;
}

function applyPalette(name) {
  if (!paletteNamed(name)) return;
  if (isRows(state)) Object.assign(state.values, rowsPalette(name));
  else if (isMark(state)) Object.assign(state.values, markPalette(name));
  else if (kindOf(state) === 'orbit') Object.assign(state.values, orbitPalette(name));
  else studioPalette(state.values, name);
}

// ---------- Brand colour picker ----------
const swatchPop = document.getElementById('swatchPop');
let swatchPick = null, swatchAnchor = null;

function openSwatches(anchor, currentHex, onPick) {
  const currentKey = String(currentHex).toUpperCase();
  swatchPop.innerHTML = BRAND_COLOURS.map(([group, list]) => `<h4>${group}</h4><div class="grid">${list.map(([name, hex]) =>
    `<button style="--c:${hex};--ink:${luminance(hex) > 0.55 ? '#151515' : '#FCFCFC'}" data-hex="${hex}" aria-label="${name} ${hex}" aria-pressed="${hex === currentKey}">${hex === currentKey ? icon('check') : ''}</button>`).join('')}</div>`).join('')
    + `<p class="picked">${brandName(currentHex) ? `${escapeHtml(brandName(currentHex))} · ${currentKey}` : `${escapeHtml(currentKey)} is off-brand`}</p>`;
  swatchPick = onPick; swatchAnchor = anchor;
  swatchPop.hidden = false;
  swatchPop.style.transform = '';
  // Open beside the control, kept inside the window, growing out of it.
  const a = anchor.getBoundingClientRect(), p = swatchPop.getBoundingClientRect();
  const left = Math.max(8, Math.min(a.right - p.width, window.innerWidth - p.width - 8));
  const below = a.bottom + 8 + p.height <= window.innerHeight;
  swatchPop.style.left = left + 'px';
  swatchPop.style.top = (below ? a.bottom + 8 : Math.max(8, a.top - p.height - 8)) + 'px';
  swatchPop.style.transformOrigin = below ? 'top right' : 'bottom right';
  move(swatchPop, { opacity: [0, 1], y: [below ? -8 : 8, 0], scale: [0.96, 1] }, SPRING);
  move(swatchPop.querySelectorAll('button'), { opacity: [0, 1], scale: [0.4, 1] }, { ...SPRING, delay: stagger(0.007) });
  (swatchPop.querySelector('[aria-pressed="true"]') || swatchPop.querySelector('button')).focus();
}
function closeSwatches(restoreFocus = false) {
  if (swatchPop.hidden || !swatchPick) return;
  if (restoreFocus && swatchAnchor && swatchAnchor.isConnected) swatchAnchor.focus();
  swatchPick = null; swatchAnchor = null;
  // Reopening during the fade sets a new pick, which keeps the popover up.
  after(move(swatchPop, { opacity: 0, scale: 0.97 }, SNAP), () => { if (!swatchPick) swatchPop.hidden = true; });
}
swatchPop.addEventListener('click', (e) => {
  const button = e.target.closest('button[data-hex]');
  if (!button || !swatchPick) return;
  const pick = swatchPick;
  closeSwatches(true);
  pick(button.dataset.hex);
});
swatchPop.addEventListener('pointerover', (e) => {
  const button = e.target.closest('button[data-hex]');
  if (button) swatchPop.querySelector('.picked').textContent = `${brandName(button.dataset.hex)} · ${button.dataset.hex}`;
});
document.addEventListener('pointerdown', (e) => {
  if (!swatchPop.hidden && !swatchPop.contains(e.target) && e.target !== swatchAnchor && !(swatchAnchor && swatchAnchor.contains(e.target))) closeSwatches();
});

// ---------- Dropdowns ----------
// A press on any dropdown opens this list instead of the system one: brand styling, pattern groups as headings,
// a check on the current choice. From the keyboard, arrows still change the value; Enter or Space opens the list.
const listbox = document.createElement('div');
listbox.className = 'listbox';
listbox.setAttribute('role', 'listbox');
listbox.hidden = true;
document.body.appendChild(listbox);
let listboxFor = null;

function openListbox(select) {
  listboxFor = select;
  // The pattern menu shows each pattern as its first preset looks, like the presets window.
  const previews = select.id === 'patternSelect';
  listbox.classList.toggle('previews', previews);
  const item = (o) => `<button type="button" role="option" data-value="${escapeHtml(o.value)}" aria-selected="${o.value === select.value}"${o.disabled ? ' disabled' : ''}>`
    + (previews ? `<canvas width="72" height="72" aria-hidden="true"></canvas>` : '')
    + `<span>${escapeHtml(o.textContent)}</span>${o.value === select.value ? icon('check') : ''}</button>`;
  listbox.innerHTML = [...select.children].map((child) => child.tagName === 'OPTGROUP'
    ? `<div class="group">${escapeHtml(child.label)}</div>${[...child.children].map(item).join('')}` : item(child)).join('');
  if (previews) for (const c of listbox.querySelectorAll('canvas')) {
    const preset = firstPreset(c.parentElement.dataset.value);
    if (preset) paintThumb(c, 'builtin:' + preset.name, presetState('builtin:' + preset.name));
  }
  listbox.hidden = false;
  listbox.style.maxHeight = '';
  const a = select.getBoundingClientRect();
  listbox.style.minWidth = a.width + 'px';
  // Below the field when it fits (or has more room), otherwise above; scrolls when taller than the room.
  const natural = listbox.getBoundingClientRect(), roomBelow = window.innerHeight - a.bottom - 12, roomAbove = a.top - 12;
  const below = roomBelow >= Math.min(natural.height, 260) || roomBelow >= roomAbove;
  const height = Math.min(natural.height, below ? roomBelow : roomAbove);
  listbox.style.maxHeight = height + 'px';
  listbox.style.left = Math.max(8, Math.min(a.left, window.innerWidth - natural.width - 8)) + 'px';
  listbox.style.top = (below ? a.bottom + 4 : a.top - 4 - height) + 'px';
  select.setAttribute('aria-expanded', 'true');
  const chosen = listbox.querySelector('[aria-selected="true"]') || listbox.querySelector('button:not(:disabled)');
  if (chosen) { chosen.scrollIntoView({ block: 'nearest' }); chosen.focus({ preventScroll: true }); }
  move(listbox, { opacity: [0, 1], y: [below ? -6 : 6, 0] }, SNAP);
}
function closeListbox(restoreFocus = false) {
  if (listbox.hidden) return;
  const select = listboxFor;
  listbox.hidden = true; listboxFor = null;
  if (select) select.setAttribute('aria-expanded', 'false');
  if (restoreFocus && select && select.isConnected) select.focus({ preventScroll: true });
}
listbox.addEventListener('click', (e) => {
  const button = e.target.closest('button[data-value]');
  if (!button || !listboxFor) return;
  const select = listboxFor;
  closeListbox(true);
  if (select.value !== button.dataset.value) { select.value = button.dataset.value; select.dispatchEvent(new Event('change', { bubbles: true })); }
});
listbox.addEventListener('keydown', (e) => {
  e.stopPropagation();  // arrow keys move through the list, not through looks
  const items = [...listbox.querySelectorAll('button:not(:disabled)')], index = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[E.clamp(index + (e.key === 'ArrowDown' ? 1 : -1), 0, items.length - 1)]?.focus(); }

// ---------- Seed: remix ----------
// A seed is a repeatable remix of the loaded preset: the same preset and seed always give the same look,
// and the preset's own seed gives the preset back. Remixes are composed, not scattered: every choice comes
// from a short list of proportions that keep a pattern regular (even cells, one item count for every row,
// whole wave cycles, bands at clean angles, one brand palette), so each result reads as a uniform pattern.
// Export format and animation speeds are left alone.
const MAX_SEED = 999999;

function seededRandom(seed) {
  let s = seed >>> 0;
  return () => {
    s += 0x6D2B79F5;
    let n = s;
    n = Math.imul(n ^ (n >>> 15), n | 1);
    n ^= n + Math.imul(n ^ (n >>> 7), n | 61);
    return ((n ^ (n >>> 14)) >>> 0) / 4294967296;
  };
}

function variationOf(pattern, base, seed) {
  if (seed === base.seed) return structuredClone(base);
  const random = seededRandom(seed);
  const pick = (list) => list[Math.floor(random() * list.length)];
  const next = structuredClone(base);
  next.seed = seed;
  // Only palettes whose mark colours stand clear of the background (Wave Rows uses just the first).
  const rows = patternOf(pattern).kind === 'rows';
  const clear = (p, hex) => Math.abs(luminance(p.background) - luminance(hex)) >= 0.36;
  const palette = pick(BRAND_PALETTES.filter((p) => clear(p, p.stop1) && (rows || clear(p, p.stop2))));
  if (rows) return remixRows(next, pick, palette);
  if (patternOf(pattern).kind === 'mark') return remixMark(next, pick, palette);
  if (patternOf(pattern).kind === 'orbit') return remixOrbit(next, pick, palette);
  return remixStudio(pattern, next, base, pick, random, palette);
}

/** Horizon: the centre moves to a corner or an edge, the field stays near circles, and depth, stretch and the
 *  grid stay in ranges that read as arcs. */
/** Orbit: the centre goes to a corner or an edge; lines, bend and spacing stay in ranges that read as arcs. */
function remixOrbit(v, pick, palette) {
  if (v.layout === 'grid') {
    const { palette: name, background, ink, ink2, ...grid } = remixVector({ ...v.grid }, pick, palette);
    return Object.assign(v, { grid, palette: name, background, ink, ink2 });
  }
  const [centreX, centreY] = pick([[0, 0], [1, 0], [0, 1], [1, 1], [0.5, 0], [0, 0.5]]);
  return Object.assign(v, {
    centreX, centreY, stretch: pick([1, 1.3, 1.7]), twist: pick([0, 0, 20, -20]), lines: pick([30, 40, 52]), crowding: pick([1.3, 1.6, 2]),
    bend: pick([0.2, 0.3, 0.5, -0.3]), growth: pick([0.2, 0.35, 0.5]), length: pick([0.045, 0.055, 0.07]), taper: pick([0, 0.3, 0.6]), ...orbitPalette(palette.name),
  });
}

function remixVector(v, pick, palette) {
  const [centreX, centreY] = pick([[0, 0], [1, 0], [0, 1], [1, 1], [0.5, 0], [0, 0.5]]);
  return Object.assign(v, {
    centreX, centreY, spiral: pick([0, 0, 0, 15, -15, 35]), perspective: pick([0.8, 0.86, 0.9]), ellipse: pick([1.6, 2.2, 2.8]),
    columns: pick([10, 12, 15]), rows: pick([28, 34, 40]), gapX: pick([0.3, 0.45, 0.55]), gapY: pick([0.82, 0.865, 0.9]), radius: pick([1, 1, 0.5, 0]), ...vectorPalette(palette.name),
  });
}

/** Bracket: the mark and its grid stay; texture, detail and effect come in combinations that keep the cells legible. */
function remixMark(v, pick, palette) {
  const texture = pick(['pixel', 'pixel', 'line', 'dot', 'slash']);
  const weight = pick({ pixel: [1, 0.86, 0.72], line: [0.4, 0.5, 0.62], dot: [0.7, 0.82, 0.92], slash: [0.5, 0.7] }[texture]);
  const effect = pick(['wave', 'scan', 'build', 'glitch', 'ripple', 'sparkle']);
  return Object.assign(v, {
    texture, weight, detail: pick([1, 1, 2, 2, 3]),
    effect, depth: pick([0.5, 0.7, 0.9]), frequency: pick([1, 1.5, 2, 3]), direction: pick([0, 45, 90, 135, 180, 270]),
    affects: effect === 'build' || effect === 'scan' ? 'both' : pick(['opacity', 'size', 'both']),
    ...markPalette(palette.name),
  });
}

/** Wave Rows: one cell shape on an even grid, a whole number of wave cycles, bands leaning one cell per row. */
function remixRows(v, pick, palette) {
  const rows = pick([12, 16, 20, 24, 32]);
  const cell = pick([
    { items: rows, gapX: 0.2, gapY: 0.2, radius: 0 },                     // squares
    { items: rows, gapX: 0.28, gapY: 0.28, radius: 1 },                   // dots
    { items: rows / 2, gapX: 0.16, gapY: 0.42, radius: 0 },               // dashes
    { items: rows / 2, gapX: 0.16, gapY: 0.42, radius: 1 },               // pills
    { items: Math.max(2, rows / 4), gapX: 0.06, gapY: 0.5, radius: 0 },   // bars
  ]);
  // Whole wave cycles with at least six cells each; fewer and the wave aliases into noise.
  const cyclesFor = (cells) => [1, 2, 3, 4].filter((c) => cells / c >= 6);
  const across = cyclesFor(cell.items), down = cyclesFor(rows);
  // Bands run down the grid (vertical), across it (horizontal), or, on square cells, diagonally by shifting
  // one or two cells per row. Diagonals on wide dashes and bars read as jagged.
  const square = cell.items === rows;
  const direction = !across.length ? 'horizontal' : pick(square ? ['vertical', 'horizontal', 'diagonal', 'diagonal'] : ['vertical', 'horizontal']);
  let cycles = 0, lean = 0;
  if (direction === 'horizontal') lean = 360 * pick(down) / rows;
  else {
    cycles = pick(across);
    if (direction === 'diagonal') lean = pick([1, -1, 2, -2]) * 360 * cycles / cell.items;
  }
  const shade = pick([
    { opacityMin: pick([0.06, 0.12, 0.2]), opacityMax: 1, sizeMin: 1, sizeMax: 1 },     // tone only
    { opacityMin: 1, opacityMax: 1, sizeMin: pick([0.15, 0.3]), sizeMax: 1 },           // size only
    { opacityMin: pick([0.25, 0.4]), opacityMax: 1, sizeMin: pick([0.35, 0.5]), sizeMax: 1 },
  ]);
  const shape = pick(['sine', 'sine', 'sine', 'square', 'triangle']);
  return Object.assign(v, cell, shade, {
    rows, itemStep: 0, frequencyStep: 0, margin: pick([80, 100, 120]),
    frequency: cycles, phase: pick([0, 90, 180, 270]), rowShift: Math.round(lean * 100) / 100,
    sharpness: pick([1, 1.5, 2.2]), shape, harmonics: pick([3, 5, 7]),
    palette: palette.name, background: palette.background, ink: palette.stop1,
  });
}

// Chladni mode pairs that give strong, balanced figures.
const PLATE_MODES = [[1, 2], [2, 3], [2, 5], [3, 4], [3, 5], [3, 7], [4, 5], [4, 7], [5, 6], [5, 7], [6, 7], [5, 9]];

/** Studio patterns: the grid and its marks scale together, waves turn to clean angles, studies use known-good settings. */
function remixStudio(pattern, v, base, pick, random, palette) {
  const f = v.field, scale = pick([0.75, 1, 1, 1.25, 1.5]);
  const even = (n) => Math.max(2, Math.round(n * scale / 2) * 2);
  const single = { Strands: 'columns', 'Threshold Stripes': 'columns' }[pattern];
  if (single !== 'columns') v.layout.columns = even(base.layout.columns);
  if (single !== 'rows') v.layout.rows = pattern === 'Kaleido Pixels' ? v.layout.columns : even(base.layout.rows);
  // Marks shrink as the grid gets finer, so density stays even.
  for (const key of ['thickness', 'length']) {
    const m = v.mappings[key];
    m.min = Math.round(base.mappings[key].min / scale * 10) / 10;
    m.max = Math.round(base.mappings[key].max / scale * 10) / 10;
  }
  v.marks.fillThickness = Math.round(base.marks.fillThickness / scale * 2) / 2;

  // Waves at whole or half cycles, pointing at clean angles; the second wave crosses the first squarely or at 45°.
  // Barcode's rhythm comes from near-horizontal bands, so its waves stay near flat.
  const angle = pattern === 'Barcode' ? pick([0, 15, 30, 90]) : pick([0, 30, 45, 60, 90, 120, 135, 150]);
  if (f.waveA.weight > 0) Object.assign(f.waveA, { frequency: pick([0.5, 1, 1.5, 2, 3]), direction: angle, phase: pick([0, 90, 180, 270]) });
  if (f.waveB.weight > 0) Object.assign(f.waveB, { frequency: pick([0.5, 1, 1.5, 2]), direction: angle + pick([90, 45, -45]) });
  if (f.radial.weight > 0) f.radial.frequency = pick([1, 2, 3]);
  v.shaping.contrast = Math.round(base.shaping.contrast * pick([0.85, 1, 1.15]) * 100) / 100;
  if (base.shaping.quantise > 0) v.shaping.quantise = pick([4, 6, 8]);
  f.shape = pick(['sine', 'sine', 'sine', 'square', 'triangle']);
  f.harmonics = pick([3, 5, 7]);

  switch (pattern) {
    case 'Eddy':
      v.attractor.strength = pick([0.4, 0.6, -0.4]); f.gradient.direction = pick([0, 45, 90, 135]);
      Object.assign(v.attractor, { x: 0.5, y: 0.5 }); break;
    case 'Halftone Diagonal':
      f.gradient.direction = pick([0, 45, 90, 135, 180]); v.marks.fixedAngle = pick([-45, 45, 0, 90]); v.shaping.gamma = pick([1, 1.35, 1.8]); break;
    case 'Strands': v.layout.rotation = pick([0, 0, -45, 45, 90]); v.marks.threshold = pick([0.44, 0.5, 0.56]); f.waveA.direction = pick([80, 90, 100]); break;
    case 'Cymatics': {
      const [n, m] = pick(PLATE_MODES);
      Object.assign(f.plate, { n, m, mix: pick([-45, 45]) }); v.shaping.gamma = pick([3.5, 4.5, 6]); break;
    }
    case 'Interference':
      Object.assign(f.ripples, { sources: pick([2, 3, 4, 6]), spread: pick([0.12, 0.18, 0.25]), frequency: pick([6, 8, 10, 12]), rotation: pick([0, 45, 90]), decay: 0 }); break;
    case 'Logo Field':
      Object.assign(f.logo, { frequency: pick([8, 10, 12, 14]), size: pick([0.4, 0.46, 0.55]), fill: pick(['on', 'on', 'empty', 'off']),
        line: pick([1, 1.6, 2.4]), fade: pick([0, 0.5, 1]) }); break;
    default: break;
  }

  // Pulse now and then, laid square to the pattern.
  if (random() < 0.2) {
    Object.assign(v.pulse, {
      enabled: true, opacityMin: pick([0.3, 0.5]), opacityMax: 1, sizeMin: pick([0.5, 0.7]), sizeMax: 1,
      frequency: pick([1, 2]), direction: pick([0, 45, 90, 135]), phase: 0, sharpness: 1.5, shape: 'sine', harmonics: 8,
    });
  }
  // One brand palette. A pattern with a single mark colour keeps it an exact brand colour.
  studioPalette(v, palette.name);
  if (v.colour.source === 'constant') v.colour.stop2 = v.colour.stop1;
  return v;
}

function applySeed(raw) {
  const seed = E.clamp(Math.round(Number(raw) || 0), 0, MAX_SEED);
  const base = baseline.pattern === state.pattern ? baseline.values : defaultsFor(state.pattern);
  const remix = variationOf(state.pattern, base, seed);
  // A remix changes the look, not the output or the motion.
  if (isFlat(state)) Object.assign(remix, { format: state.values.format, speed: state.values.speed });
  else { remix.canvas = { ...state.values.canvas }; remix.motion = { ...state.values.motion }; remix.pulse.speed = state.values.pulse.speed; }
  state.values = remix;
