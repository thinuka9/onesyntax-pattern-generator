  move(document.getElementById('seedInput'), { opacity: [0.2, 1], y: [7, 0] }, SNAP);
}
const newVariation = () => applySeed(1 + Math.floor(Math.random() * MAX_SEED));
/** Shuffle: another pattern, picked at random, one of its presets, remixed with a random seed (new colours and
 *  settings), kept at the current format. The seed dice remixes within the pattern. */
function shuffle() {
  const format = isFlat(state) ? state.values.format : state.values.canvas.format;
  const names = PATTERNS.map((p) => p.name).filter((n) => n !== state.pattern);
  const pattern = names[Math.floor(Math.random() * names.length)], presets = BUILT_INS.filter((b) => b.pattern === pattern);
  applyPreset('builtin:' + presets[Math.floor(Math.random() * presets.length)].name);
  if (FORMATS[format]) setFormat(format);
  newVariation();
  // One undo goes back to before the shuffle: the preset it passed through on the way is not a stop of its own.
  timeline.past.pop();
}

function updateHeader() {
  const pattern = patternOf(state.pattern);
  const preset = presetState(current);
  document.getElementById('eyebrow').textContent = `Generative system / ${String(PATTERNS.indexOf(pattern) + 1).padStart(2, '0')}`;
  document.getElementById('title').textContent = preset && preset.pattern === state.pattern ? label(current) : pattern.name;
  document.getElementById('lede').textContent = pattern.description;
  updateDots();
}

// ---------- Undo / redo ----------
// Each slider drag is one step: the snapshot before it is pushed on the first change and
// the new state is committed once the control has been still for 400 ms.
const timeline = { past: [], future: [], committed: null, pending: false, timer: 0 };
const snapshot = () => ({ state: structuredClone(state), current, baseline: structuredClone(baseline) });

function recordEdit() {
  if (!timeline.pending) {
    timeline.past.push(timeline.committed);
    if (timeline.past.length > 200) timeline.past.shift();
    timeline.future = [];
    timeline.pending = true;
  }
  clearTimeout(timeline.timer);
  timeline.timer = setTimeout(settle, 400);
}
function settle() {
  clearTimeout(timeline.timer);
  if (timeline.pending) { timeline.committed = snapshot(); timeline.pending = false; }
}
function restore(snap) {
  const newLook = snap.state.pattern !== state.pattern || snap.current !== current;
  state = structuredClone(snap.state); current = snap.current; baseline = structuredClone(snap.baseline);
  time = 0; offerUndo = false; message = null;
  buildPanel({ enter: newLook }); changed();
  if (newLook) crossfade();
  timeline.committed = snapshot();
}
/** A new look: the canvas dissolves in rather than cutting. */
const crossfade = () => move(canvas, { opacity: [0.45, 1] }, { duration: 0.38, ease: [0.2, 0.8, 0.2, 1] });
function undoStep() {
  settle();
  if (!timeline.past.length) return;
  timeline.future.push(snapshot());
  restore(timeline.past.pop());
}
function redoStep() {
  settle();
  if (!timeline.future.length) return;
  timeline.past.push(snapshot());
  restore(timeline.future.pop());
}
function updateHistoryButtons() {
  document.getElementById('undo').disabled = !timeline.past.length;
  document.getElementById('redo').disabled = !timeline.future.length;
}
document.getElementById('undo').addEventListener('click', undoStep);
document.getElementById('redo').addEventListener('click', redoStep);

// ---------- Presets ----------
let message = null, offerUndo = false;
const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function refreshPresets() {
  const old = document.querySelector('#panelScroll > .sec:first-child');
  if (old) old.replaceWith(buildPicker());
  updateHeader();
  updateStatus();
}

function updateStatus() {
  updateHistoryButtons();
  const el = document.getElementById('presetStatus');
  el.className = 'status';
  if (message) el.textContent = message;
  else if (edited()) { el.textContent = 'Edited · save to keep these changes'; el.classList.add('edited'); }
  else el.textContent = current.startsWith('saved:') ? 'Saved in this browser' : presetState(current) ? 'Built-in preset' : '';
  if (offerUndo && timeline.past.length) {
    const button = document.createElement('button');
    button.textContent = 'Undo';
    button.addEventListener('click', () => { undoStep(); message = 'Restored your previous preset'; updateStatus(); });
    el.appendChild(button);
  }
  document.getElementById('play').hidden = !animated();
}

function applyPreset(id) {
  const next = presetState(id);
  if (!next) return;
  settle();
  const wasEdited = edited();
  timeline.past.push(timeline.committed); timeline.future = [];
  offerUndo = wasEdited;
  message = wasEdited ? `Loaded ${label(id)} · your edits weren't saved` : null;
  // A built-in preset has no sticker, so the one in use stays; a saved preset brings its own.
  if (!next.values.sticker && state.values.sticker) next.values.sticker = structuredClone(state.values.sticker);
  state = next; baseline = structuredClone(next); current = id; time = 0;
  buildPanel({ enter: true }); changed(); crossfade();
  timeline.committed = snapshot();
}

function savePreset(rawName) {
  let name = rawName.trim();
  if (!name) name = current.startsWith('saved:') ? label(current) : `Preset ${saved.length + 1}`;
  const existing = saved.find((p) => p.name === name);
  const entry = { v: STORAGE_VERSION, name, pattern: state.pattern, values: structuredClone(state.values) };
  if (existing) Object.assign(existing, entry); else saved.push(entry);
  settle();
  current = 'saved:' + name; baseline = structuredClone(state); offerUndo = false;
  timeline.committed = snapshot();
  message = storePresets()
    ? (existing ? `Updated "${name}"` : `Saved "${name}"`)
    : `Saved "${name}" for this visit only · this browser blocks storage, so export your presets to keep them`;
  save(); refreshPresets();
}

function deletePreset(name) {
  saved = saved.filter((p) => p.name !== name);
  storePresets();
  if (current === 'saved:' + name) {
    settle();
    current = 'unsaved'; baseline = structuredClone(state); offerUndo = false;
    timeline.committed = snapshot();
  }
  message = `Deleted "${name}"`;
  save(); refreshPresets();
}

function exportPresets() {
  const json = JSON.stringify({ app: 'onesyntax-wave-rows', version: STORAGE_VERSION, presets: saved }, null, 2);
  download(new Blob([json], { type: 'application/json' }), 'OneSyntax_WaveRows-presets.json');
}

async function importPresets(file) {
  if (!file) return;
  let incoming = [];
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : Array.isArray(data.presets) ? data.presets : [data];
    const base = file.name.replace(/\.json$/i, '');
    incoming = list.map((p, i) => fromImported(p, list.length > 1 ? `${base} ${i + 1}` : base)).filter(Boolean);
  } catch { notify(`Couldn't read ${file.name} · is it a presets JSON file?`, { error: true }); return; }
  for (const p of incoming) {
    const existing = saved.find((s) => s.name === p.name);
    if (existing) Object.assign(existing, p); else saved.push(p);
  }
  storePresets();
  if (incoming.length) { looksDialog.close(); applyPreset('saved:' + incoming[0].name); message = `Imported ${incoming.length} preset${incoming.length === 1 ? '' : 's'}`; }
  else notify('No presets found in that file', { error: true });
  refreshPresets();
}

function changed() { save(); fullSharpness(); requestRender(); updateStatus(); }
// A hand edit replaces any one-off status message with the live "edited" state.
function edit() { message = null; offerUndo = false; recordEdit(); changed(); }

// ---------- Save bar ----------
const saveRow = document.getElementById('saveRow'), saveName = document.getElementById('saveName');
function openSave() {
  saveName.value = current.startsWith('saved:') ? label(current) : '';
  saveRow.hidden = false; saveName.focus(); saveName.select();
}
function closeSave() { saveRow.hidden = true; }
document.getElementById('saveLook').addEventListener('click', () => (saveRow.hidden ? openSave() : (savePreset(saveName.value), closeSave())));
document.getElementById('saveConfirm').addEventListener('click', () => { savePreset(saveName.value); closeSave(); });
document.getElementById('saveCancel').addEventListener('click', closeSave);
saveName.addEventListener('keydown', (e) => { if (e.key === 'Enter') { savePreset(saveName.value); closeSave(); } else if (e.key === 'Escape') closeSave(); });
document.getElementById('variation').addEventListener('click', shuffle);
document.getElementById('revert').addEventListener('click', () => applyPreset(current));

// ---------- Look picker, arrows and dots ----------
const looksDialog = document.getElementById('looks');
// Built-in looks never change, so each thumbnail is drawn once (at the picker's size) and scaled from then on.
const thumbCache = new Map();
function thumbImage(id, st) {
  let image = thumbCache.get(id);
  if (!image) {
    image = document.createElement('canvas');
    image.width = image.height = 280;
    drawThumb(image, st);
    thumbCache.set(id, image);
  }
  return image;
}
function paintThumb(c, id, st) {
  if (!id.startsWith('builtin:')) { drawThumb(c, st); return; }
  const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  g.drawImage(thumbImage(id, st), 0, 0, c.width, c.height);
}
/** Draws the built-in thumbnails one by one in idle moments after load, so the presets window opens instantly. */
function warmThumbnails() {
  const ids = BUILT_INS.map((b) => 'builtin:' + b.name);
  // At least one every 200 ms even when the page is never idle (a heavy animation), more when there is time.
  const idle = window.requestIdleCallback ? (fn) => requestIdleCallback(fn, { timeout: 200 }) : (fn) => setTimeout(() => fn({ didTimeout: true, timeRemaining: () => 0 }), 50);
  const next = (deadline) => {
    do { const id = ids.shift(); thumbImage(id, presetState(id)); } while (ids.length && !deadline.didTimeout && deadline.timeRemaining() > 6);
    if (ids.length) idle(next);
  };
  idle(next);
}

/** The current pattern's presets, saved ones first: the arrows, ← → and the dots move through these only. */
const patternLookIds = () => [
  ...saved.filter((s) => patternOf(s.pattern).name === state.pattern).map((s) => 'saved:' + s.name),
  ...BUILT_INS.filter((b) => b.pattern === state.pattern).map((b) => 'builtin:' + b.name),
];
function stepLook(direction) {
  const ids = patternLookIds();
  let index = ids.indexOf(current);
  if (index < 0) {
    // From an unsaved look, ← returns to its pattern's preset and → moves past it.
    index = Math.max(0, ids.indexOf('builtin:' + firstPreset(state.pattern).name));
    if (direction < 0) { applyPreset(ids[index]); return; }
  }
  applyPreset(ids[(index + direction + ids.length) % ids.length]);
}
document.getElementById('prevLook').addEventListener('click', () => stepLook(-1));
document.getElementById('nextLook').addEventListener('click', () => stepLook(1));

function updateDots() {

// The link holds only the values that differ from the pattern's built-in preset, compressed.

function exportAnimatedSVG() {
  if (!animated()) { notify('Nothing is moving yet. Turn up Speed, then export.', { error: true }); return; }
  notify('Building animated SVG…', { stay: true });
  // Let the message paint before the work starts.
  setTimeout(() => {
    try {

      const v = state.values, sliding = kindOf(state) === 'orbit' && v.layout !== 'grid';
      const sticker = stickerOn(state), st = sticker ? stickerState(state) : state, transparent = sticker || exportOptions.transparent;
      const result = sliding ? orbitAnimatedSVG(st, { transparent }) : animatedSVG(st, { transparent });
      if (sticker) result.svg = stickerSVG(result.svg, geometryFor(st, 0));
      download(new Blob([result.svg], { type: 'image/svg+xml' }), `${fileBase()}${sticker ? '_sticker' : ''}_${result.loop}s-loop.svg`);
      const size = result.svg.length < 1e6 ? `${Math.round(result.svg.length / 1e3)} KB` : `${(result.svg.length / 1e6).toFixed(1)} MB`;
      // Thousands of animated marks play heavily in a browser; past that, video is the smoother web format.
      const heavy = result.svg.length > HEAVY_ANIMATED_SVG_BYTES || result.marks > HEAVY_ANIMATED_SVG_MARKS;
      notify(`Exported an animated SVG · ${result.loop}-second loop · ${size}${heavy ? ' · busy for the web: Video plays smoother, or use fewer marks' : ''}`);
    } catch (error) { notify(error.message, { error: true }); }
  }, 30);
}

// ---------- Animation & video ----------
// Every moving part is measured in cycles per 5 s, in half steps: whole cycles loop in 5 s, halves in 10 s.
const speedsOf = (st) => isRows(st) ? [st.values.speed]

    pulseActive(st.values.pulse) ? st.values.pulse.speed : 0]

const orbiting = (v) => v.field.ripples.enabled && v.field.ripples.weight > 0 && v.field.ripples.orbit !== 0;
const isAnimated = (st) => isFlat(st) ? speedsOf(st).some((s) => s !== 0)
  : st.values.motion.speed !== 0 || orbiting(st.values) || (pulseActive(st.values.pulse) && st.values.pulse.speed !== 0);
const animated = () => isAnimated(state);
const loopSeconds = (st) => speedsOf(st).every(Number.isInteger) ? 5 : 10;

// Fast path: WebCodecs encodes each frame as soon as it is drawn (no real-time wait, the tab may be hidden), at exact
// frame times, and mp4-muxer (MIT, loaded on first use) packs the H.264 stream into an MP4. Where the browser lacks
// either, or anything fails, exportVideo falls back to recordLoop below.
const MP4_MUXER = './vendor/mp4-muxer.js';
let muxerLoading = null;
const loadMuxer = () => window.Mp4Muxer ? Promise.resolve(window.Mp4Muxer) : (muxerLoading ||= new Promise((resolve, reject) => {
  const script = document.createElement('script');
  script.src = MP4_MUXER;
  script.onload = () => (window.Mp4Muxer ? resolve(window.Mp4Muxer) : reject(new Error('mp4-muxer did not load')));
  script.onerror = () => { muxerLoading = null; reject(new Error('mp4-muxer did not load')); };
  document.head.appendChild(script);
}));

/** Frame size for video: the artwork scaled to fit 1920 px, in even numbers as H.264 needs. */
function videoSize(st) {
  if (stickerOn(st)) return [STICKER_SIZE, STICKER_SIZE];
  const first = geometryFor(st, 0), fit = Math.min(1, 1920 / Math.max(first.width, first.height));
  return [Math.round(first.width * fit / 2) * 2, Math.round(first.height * fit / 2) * 2];

  if (!config) return null;
  const { Muxer, ArrayBufferTarget } = await loadMuxer();
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width, height, frameRate: fps }, fastStart: 'in-memory' });
  let failure = null;
  const encoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (error) => { failure = error; } });
  encoder.configure(config);
  const out = document.createElement('canvas');
  out.width = width; out.height = height;
  let renderer = null;
  // A sticker is painted in 2D (its text and outline are not marks).
  try { renderer = stickerOn(snap) ? null : new E.Renderer(out); } catch { renderer = null; }
  const context = renderer ? null : out.getContext('2d'), pool = {}, drawn = stickerOn(snap) ? stickerState(snap) : snap;
  try {
    const frames = fps * duration, step = Math.round(1e6 / fps);
    for (let k = 0; k < frames; k++) {
      if (failure) throw failure;
      const geo = geometryFor(drawn, k / fps, pool);
      if (renderer) renderer.render(geo, geo.params, width, height);
      else if (stickerOn(snap)) drawSticker(context, snap, geo, width / STICKER_SIZE, { page: STICKER_PAGE });
      else draw(context, geo, width / geo.width);
      const frame = new VideoFrame(out, { timestamp: k * step, duration: step });
      encoder.encode(frame, { keyFrame: k % (fps * 2) === 0 });  // a keyframe every 2 s keeps seeking quick
      frame.close();
      // Let the encoder catch up, and the page breathe now and then.
      while (encoder.encodeQueueSize > 8) await new Promise((resolve) => setTimeout(resolve, 4));
      if (k % 10 === 9) { if (onProgress) onProgress((k + 1) / frames); await new Promise((resolve) => setTimeout(resolve, 0)); }
    }
    await encoder.flush();
    if (failure) throw failure;
    muxer.finalize();
  } finally {
    if (encoder.state !== 'closed') encoder.close();
    if (renderer) renderer.dispose(true);
  }
  return { blob: new Blob([muxer.target.buffer], { type: 'video/mp4' }), ext: 'mp4', duration, width, height };
}

async function recordLoop(onProgress) {
  const types = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mimeType = typeof MediaRecorder === 'undefined' ? null : types.find((t) => MediaRecorder.isTypeSupported(t));
  const probe = document.createElement('canvas');
  if (!mimeType || !probe.captureStream) throw new Error('Video recording isn\'t available in this browser. Try Chrome or Edge.');
  const snap = structuredClone(state), fps = 30, duration = loopSeconds(snap);
  const [width, height] = videoSize(snap);
  const out = document.createElement('canvas');
  out.width = width; out.height = height;
  let renderer = null;
  try { renderer = stickerOn(snap) ? null : new E.Renderer(out); } catch { renderer = null; }
  const context = renderer ? null : out.getContext('2d');
  const pool = {};  // each recorded frame reuses one buffer
  const drawn = stickerOn(snap) ? stickerState(snap) : snap;
  const paint = (t) => {
    const geo = geometryFor(drawn, t, pool);
    if (renderer) renderer.render(geo, geo.params, width, height);
    else if (stickerOn(snap)) drawSticker(context, snap, geo, width / STICKER_SIZE, { page: STICKER_PAGE });
    else draw(context, geo, width / geo.width);
  };
  paint(0);
  let stream = out.captureStream(0), track = stream.getVideoTracks()[0];
  const manualFrames = typeof track.requestFrame === 'function';
  if (!manualFrames) { stream.getTracks().forEach((t) => t.stop()); stream = out.captureStream(fps); track = stream.getVideoTracks()[0]; }
  const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 16000000 });
  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const done = new Promise((resolve, reject) => {
    recorder.onstop = () => resolve(new Blob(chunks, { type: mimeType.split(';')[0] }));
    recorder.onerror = () => reject(new Error('Video recording failed.'));
  });
  recorder.start();
  const started = performance.now();
  try {
    for (let frame = 0; frame < fps * duration; frame++) {
      if (document.hidden) throw new Error('Keep this tab visible while recording, then try again.');
      paint(frame / fps);
      if (manualFrames) track.requestFrame();
      if (onProgress) onProgress(frame / fps, duration);
      await new Promise((resolve) => setTimeout(resolve, Math.max(0, started + (frame + 1) * 1000 / fps - performance.now())));
    }
  } finally {
    if (recorder.state !== 'inactive') recorder.stop();
    stream.getTracks().forEach((t) => t.stop());
    if (renderer) renderer.dispose(true);
  }
  return { blob: await done, ext: mimeType.startsWith('video/mp4') ? 'mp4' : 'webm', duration, width, height };
}

let recording = false;
async function exportVideo() {
  if (recording) return;
  if (!animated()) { notify('Nothing is moving yet. Turn up Animate or Speed, then export.', { error: true }); return; }
  recording = true;
  try {
    let result = null;
    try { result = await encodeLoop((share) => notify(`Encoding video · ${Math.round(share * 100)}%`, { stay: true })); }
    catch (error) { console.warn('Fast video export failed; recording in real time instead.', error); }
    if (!result) result = await recordLoop((t, d) => notify(`Recording video · ${Math.floor(t) + 1} / ${d} s`, { stay: true }));
    download(result.blob, `${fileBase()}_${result.duration}s-loop.${result.ext}`);
    notify(`Exported a ${result.duration}-second loop · ${result.width} × ${result.height} ${result.ext.toUpperCase()}`);
  } catch (error) { notify(error.message, { error: true }); }
  finally { recording = false; }
}

// ---------- Export menu ----------
const exportButton = document.getElementById('exportButton'), exportMenu = document.getElementById('exportMenu');
let menuOpen = false;
function toggleMenu(open = !menuOpen) {
  if (open === menuOpen) return;
  menuOpen = open;
  exportButton.setAttribute('aria-expanded', String(open));
  if (open) {
    for (const el of exportMenu.querySelectorAll('.loop-length')) el.textContent = animated() ? `${loopSeconds(state)} s loop` : 'needs motion';
    document.getElementById('transparent').checked = exportOptions.transparent;
    exportMenu.hidden = false;
    // The menu grows up out of its button; its rows follow a beat behind.
    move(exportMenu, { opacity: [0, 1], y: [10, 0], scale: [0.96, 1] }, SPRING);
    move(exportMenu.querySelectorAll('button, label'), { opacity: [0, 1], x: [-6, 0] }, { ...SPRING, delay: stagger(0.025) });
  } else {
    after(move(exportMenu, { opacity: 0, y: 6, scale: 0.98 }, SNAP), () => { if (!menuOpen) exportMenu.hidden = true; });
  }
}
exportButton.addEventListener('click', () => toggleMenu());
exportMenu.addEventListener('click', (e) => {
  const action = e.target.closest('[data-action]');
  if (!action) return;
  toggleMenu(false);
  ({ png: () => exportPNG(Number(action.dataset.scale)), svg: exportSVG, animatedSvg: exportAnimatedSVG, video: exportVideo, link: copyLink })[action.dataset.action]();
});
document.getElementById('transparent').addEventListener('change', (e) => { exportOptions.transparent = e.target.checked; write('wave-rows-export', exportOptions); });
document.addEventListener('pointerdown', (e) => { if (menuOpen && !e.target.closest('.menu-wrap')) toggleMenu(false); });

// ---------- View, playback and keys ----------
const viewButtons = [...document.querySelectorAll('.view button')];
function updateViewToggle(animate = false) {
  for (const b of viewButtons) b.setAttribute('aria-pressed', String(b.dataset.view === viewMode));
  placeIndicator(document.querySelector('.view'), animate);
}
for (const b of viewButtons) b.addEventListener('click', () => {
  if (viewMode === b.dataset.view) return;
  viewMode = b.dataset.view; write('wave-rows-view', viewMode); updateViewToggle(true); requestRender(); crossfade();
});
// Indicators are measured in pixels, so they follow the layout when fonts arrive or the window resizes.
const replaceIndicators = () => document.querySelectorAll('.segmented, .view').forEach((group) => placeIndicator(group, false));
document.fonts.ready.then(replaceIndicators);
window.addEventListener('resize', replaceIndicators);

const playButton = document.getElementById('play');
playButton.addEventListener('click', () => {
  paused = !paused;
  fullSharpness(); requestRender();  // a paused frame redraws at full sharpness
  playButton.innerHTML = icon(paused ? 'play' : 'pause');
  playButton.setAttribute('aria-label', paused ? 'Play animation' : 'Pause animation');
  playButton.dataset.tip = paused ? 'Play' : 'Pause';
});

document.addEventListener('keydown', (e) => {
  if (looksDialog.open) return;
  const typing = e.target.matches('input[type=text], input[type=number], textarea, select, input[type=range]');
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    if (e.target.matches('input[type=text], input[type=number], textarea')) return;  // keep native text undo
    const key = e.key.toLowerCase();
    if (key === 'z' && !e.shiftKey) { e.preventDefault(); undoStep(); }
    else if ((key === 'z' && e.shiftKey) || key === 'y') { e.preventDefault(); redoStep(); }
    return;
  }
  if (e.key === 'Escape') { toggleMenu(false); closeSave(); closeSwatches(true); return; }
  if (typing || e.altKey || e.shiftKey) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepLook(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepLook(1); }
});

let last = performance.now();
// Adaptive sharpness: twenty slow frames (over 24 ms) while animating lighten the canvas; quick ones pay that back.
let lightened = false, slowFrames = 0;
function pace(ms) {
  if (ms > 24) { if (++slowFrames >= 20) lightened = true; }
  else slowFrames = Math.max(0, slowFrames - 1);
}
function fullSharpness() { lightened = false; slowFrames = 0; }
function tick(now) {
  const interval = now - last, dt = Math.min(0.1, interval / 1000); last = now;
  if (animated() && !paused) { pace(interval); time += dt; renderQueued = true; }
  if (renderQueued) { renderQueued = false; render(); }
  requestAnimationFrame(tick);
}

(async function start() {
  await openSharedLook();
  // Build logo grids before the first frame, so neither the canvas nor the thumbnails flash without the logo.
  await Promise.all([state, ...BUILT_INS.filter((b) => b.group === 'Wave studies')].map((st) => ensureLogoSdf(st.values).catch(() => {})));
  timeline.committed = snapshot();
  updateViewToggle();
  buildPanel({ enter: true });
  window.addEventListener('resize', requestRender);
  render();
  updateStatus();
  // First paint: the panel and the chrome settle in from where they sit.
  move(panelEl, { opacity: [0, 1], x: [24, 0] }, GENTLE);
  move(document.querySelectorAll('.topbar, .edge, .dots, .meta'), { opacity: [0, 1] }, { duration: 0.5, delay: stagger(0.05) });
  setTimeout(warmThumbnails, 1500);  // once the first frames are up
  requestAnimationFrame(tick);
})();
</script>
